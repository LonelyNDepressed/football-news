      <stop offset="0" stop-color="#131d3d"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d06f"/>
